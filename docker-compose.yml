services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yahtzee
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yahtzee"]
      interval: 3s
      timeout: 3s
      retries: 10

  server-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CLIENT_URL: http://localhost:3001
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Yahtzee <no-reply@yahtzee.local>"
    ports:
      - "3000:3000"
    volumes:
      - ./server:/repo/server
      - /repo/server/node_modules
      - ./shared:/repo/shared
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit
    ports:
      - "8025:8025"

  server:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: server/Dockerfile
      target: prod
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CLIENT_URL: ${CLIENT_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  client-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: client/Dockerfile
      target: dev
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_USE_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./client:/repo/client
      - /repo/client/node_modules
      - ./shared:/repo/shared
    depends_on:
      - server-dev

  client:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: client/Dockerfile
      target: prod
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "3001:80"
    depends_on:
      - server

volumes:
  db-data:
